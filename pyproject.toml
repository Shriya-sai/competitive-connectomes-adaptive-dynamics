[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luppi-recreation"
version = "0.1.0"
description = "Python analysis pipeline for reproducing and extending Luppi et al. (2026)."
authors = [{ name = "Shriya Sai" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "nibabel>=5.3,<6",
    "nilearn>=0.12,<0.13",
    "numpy",
    "pandas>=2.2,<3",
    "scipy",
    "templateflow>=24,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.urls]
Repository = "https://github.com/Shriya-sai/competitive-connectomes-adaptive-dynamics"
Issues = "https://github.com/Shriya-sai/competitive-connectomes-adaptive-dynamics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
